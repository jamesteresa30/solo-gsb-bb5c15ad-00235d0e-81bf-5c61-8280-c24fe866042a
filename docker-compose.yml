services:
  freeze-thaw-api:
    build: .
    image: freeze-thaw-api:latest
    container_name: freeze-thaw-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/freeze_thaw.db
    volumes:
      - freeze-thaw-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  freeze-thaw-data:
